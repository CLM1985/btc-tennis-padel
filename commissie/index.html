*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:0;margin:0;text-wrap:balance}
h1{font-size:clamp(1.55rem,6vw,2.1rem);line-height:1;overflow-wrap:anywhere}
h2{font-size:1.35rem}
h3{font-size:1.1rem;font-weight:600}
.lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
button,select,input,textarea{font:inherit;color:inherit}
select,input[type=text],input[type=date],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
textarea{width:100%;font-family:var(--f-mono);font-size:.8rem}
button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.5;cursor:not-allowed}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
button.primary:hover:not(:disabled){border-color:var(--lime);box-shadow:inset 0 -3px 0 var(--lime)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;
  background:var(--band);color:var(--on-band);border-radius:12px;padding:16px 20px;border-bottom:4px solid var(--lime);
  --ink:var(--on-band); --muted:var(--on-band-muted)}
.merk{display:flex;align-items:center;gap:14px;min-width:0}
.merk > div{min-width:0}

.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;color:var(--lime)}
header.top button{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
header.top .toast{color:var(--on-band)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}

h1::after{content:"";display:block;width:28px;height:3px;background:var(--lime);border-radius:2px;margin-top:8px}
.wie{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--on-band)}
.wie a{color:var(--lime)}

.k-info,.k-afspraak{--c:#5E7286;--cb:var(--info-soft)}
.k-rvb{--c:var(--warn);--cb:var(--warn-soft)}
.cgrid{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.verglijst{display:flex;flex-direction:column;gap:8px}
.verg{text-align:left;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:2px;font-weight:400}
.verg[aria-pressed=true]{border:2px solid var(--accent);padding:7px 9px;background:var(--ok-soft)}
.verg .r{display:flex;justify-content:space-between;gap:6px;align-items:center}
.verg small{color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:560px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sunk)}
.kpi b{display:block;font-family:var(--f-display);font-size:1.4rem;line-height:1.1}
.kpi span{font-size:.78rem;color:var(--muted)}
.balk{display:flex;height:10px;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.balk span{display:block;background:var(--c);border-right:2px solid var(--surface)}
.balk span:last-child{border-right:0}
.punt{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px}
.punt>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:12px 14px}
.punt>summary::-webkit-details-marker{display:none}
.punt .nr{font-family:var(--f-display);font-weight:700;font-size:1.6rem;line-height:1;color:var(--c)}
.punt .titel{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
.punt .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.punt .soort{font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--cb);color:var(--c)}
.punt .tag{font-size:.74rem;border:1px solid var(--line);border-radius:4px;padding:0 6px}
.punt .klok{font-size:.78rem;color:var(--muted);white-space:nowrap}
.punt .body{padding:0 14px 14px 54px;display:flex;flex-direction:column;gap:8px}
@media (max-width:560px){.punt .body{padding-left:14px}.punt>summary{grid-template-columns:26px minmax(0,1fr)}.punt .klok{grid-column:2}}
.blok{border-radius:8px;padding:8px 10px;font-size:.9rem}
.blok .lbl{display:block;margin-bottom:2px}
.blok ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.blok.voor{background:var(--sunk);border:1px solid var(--line)}
.blok.dec{background:var(--warn-soft)}
.blok.besl{background:var(--ok-soft)}
.blok.besl .lbl{color:var(--ok)}
.blok.vraag{border-left:3px solid #7446B0;background:#EFE8F8;border-radius:0 8px 8px 0}
.blok.vraag .lbl{color:#7446B0}
:root[data-theme=dark] .blok.vraag{background:#2E2A55}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .blok.vraag{background:#2E2A55}}
.acties{display:flex;flex-direction:column;gap:6px}
.actie{display:grid;grid-template-columns:minmax(0,1fr) 110px 90px 120px;gap:8px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);font-size:.88rem}
.actie.s-open{border-left-color:var(--warn)}.actie.s-bij_rvb{border-left-color:#9A6F12}.actie.s-klaar{border-left-color:var(--ok);opacity:.75}.actie.s-vervallen{opacity:.55}
.actie.laat{border-left-color:var(--bad);background:var(--bad-soft)}
.actie .bron{display:block;font-size:.75rem;color:var(--muted)}
.actie .dl.laat{color:var(--bad);font-weight:700}
.actie select{font-size:.8rem;padding:3px 6px}
@media (max-width:640px){.actie{grid-template-columns:minmax(0,1fr) auto}.actie .eig{grid-column:1}.actie .dl{grid-column:2;grid-row:1}}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.bev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--sunk)}
.bev textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--surface);font-family:var(--f-body);font-size:.88rem}
.namen{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem}
.namen span{border-radius:999px;padding:2px 10px;background:var(--surface);border:1px solid var(--line)}
.namen span.ja{background:var(--ok-soft);border-color:var(--ok-soft)}
.namen span.nee{background:var(--bad-soft);border-color:var(--bad-soft)}
.besl{display:flex;flex-direction:column;gap:8px}
.bs{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);display:flex;flex-direction:column;gap:2px}
.bs .r{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.bs b{font-family:var(--f-display);color:var(--accent)}
input[type=search]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="merk">
      <span class="logo" role="img" aria-label="BTC Wemmel"></span>
      <div><div class="eyebrow">BTC Wemmel · padel</div><h1>Padelcommissie</h1></div>
    </div>
    <div class="wie" id="wie"><span id="wieNaam"></span> · <a href="../">Ledenportaal</a> · <button type="button" id="afmelden">Afmelden</button></div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Padelcommissie">
    <button class="tab" role="tab" data-tab="vergaderingen" aria-selected="true">Vergaderingen</button>
    <button class="tab" role="tab" data-tab="acties" aria-selected="false" id="tabActies">Actiepunten</button>
    <button class="tab" role="tab" data-tab="beslissingen" aria-selected="false">Beslissingen</button>
  </nav>
  <p class="melding" id="melding" role="status"></p>

  <section id="v-vergaderingen">
    <div class="cgrid">
      <section class="panel" aria-labelledby="vlTitel">
        <div class="lbl" id="vlTitel">Vergaderingen</div>
        <div class="verglijst" id="vLijst"></div>
      </section>
      <div id="vDetail" style="display:flex;flex-direction:column;gap:12px;min-width:0"></div>
    </div>
  </section>

  <section id="v-acties" hidden>
    <section class="panel">
      <div class="lijn" style="justify-content:space-between"><h2>Actiepunten</h2>
        <div class="filters" id="aFilters">
          <button type="button" data-f="mijn" aria-pressed="true">Mijn acties</button>
          <button type="button" data-f="open" aria-pressed="false">Alle open</button>
          <button type="button" data-f="laat" aria-pressed="false">Te laat</button>
          <button type="button" data-f="alle" aria-pressed="false">Alle</button>
        </div></div>
      <div class="acties" id="aLijst"></div>
      <div class="muted" style="font-size:.8rem">De eigenaar of de voorzitter past de status aan. Een open actie van jou staat ook in MyBTC.</div>
    </section>
  </section>

  <section id="v-beslissingen" hidden>
    <section class="panel">
      <h2>Beslissingen</h2>
      <input type="search" id="bZoek" placeholder="Zoek in beslissingen…" aria-label="Zoek in beslissingen">
      <div class="besl" id="bLijst"></div>
    </section>
  </section>
</div>

<script>
(() => {
const API = "https://povgjkvmzfrhhaxfanwn.supabase.co/rest/v1/rpc/", KEY = "sb_publishable_LfcbY6X1DgOBFW1rH3Umnw__RdObpur";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOKEN = BTC.token;
const DAG = ["zo", "ma", "di", "wo", "do", "vr", "za"];
const STATUS_V = { gepland: ["Gepland", ""], ontwerp: ["Verslag: ontwerp", "warn"], ter_bevestiging: ["Ter bevestiging", "warn"], goedgekeurd: ["Goedgekeurd", "ok"] };
const STATUS_A = { open: "open", bij_rvb: "bij de RvB", klaar: "klaar", vervallen: "vervallen" };
const SOORT = { beslissing: "Beslissing", info: "Info", rvb: "Naar de RvB", afspraak: "Afspraak" };
let D = null, V = null, VID = null, TAB = "vergaderingen", FILTER = "mijn";

async function rpc(fn, args) {
  const r = await fetch(API + fn, { method: "POST", cache: "no-store", headers: { apikey: KEY, Authorization: "Bearer " + KEY, "Content-Type": "application/json" }, body: JSON.stringify({ p_token: TOKEN, ...(args || {}) }) });
  if (!r.ok) throw new Error("de server antwoordt niet (" + r.status + ")");
  const j = await r.json();
  if (j && j.fout === "niet aangemeld") { BTC.naarLogin(); throw new Error("niet aangemeld"); }
  return j;
}
function melding(t, soort) { const m = $("melding"); m.textContent = t || ""; m.className = "melding " + (soort || ""); }
const dt = (s) => new Date(String(s).replace(" ", "T"));
const datumLang = (s) => { const x = dt(s); return `${DAG[x.getDay()]} ${x.getDate()}/${x.getMonth() + 1}/${x.getFullYear()}`; };
const uur = (s) => { const x = dt(s); return `${x.getHours()}u${String(x.getMinutes()).padStart(2, "0")}`; };
const dKort = (s) => { const x = new Date(s + "T12:00"); return `${x.getDate()}/${x.getMonth() + 1}`; };
const vandaag = () => { const x = new Date(); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`; };
const isLaat = (a) => a.deadline && a.deadline < vandaag() && ["open", "bij_rvb"].includes(a.status);
const lijst = (xs) => `<ul>${xs.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;

async function laad() {
  D = await rpc("club_comm_data");
  if (D.fout) { melding(D.fout === "enkel voor de padelcommissie" ? "Deze pagina is enkel voor de leden van de padelcommissie." : D.fout, "fout"); document.querySelectorAll("section[id^=v-]").forEach((s) => { s.hidden = true; }); return; }
  const ik = (D.leden || []).find((l) => l.id === D.ik); $("wieNaam").textContent = ik ? ik.naam : "";
  const mijn = (D.acties || []).filter((a) => a.eigenaar === D.ik && ["open", "bij_rvb"].includes(a.status)).length;
  $("tabActies").textContent = mijn ? `Actiepunten · ${mijn} van jou` : "Actiepunten";
  tekenLijst(); tekenActies(); tekenBesl();
  const h = location.hash;
  if (/^#v\d+$/.test(h)) VID = +h.slice(2);
  if (!VID && D.vergaderingen.length) { const recent = D.vergaderingen.find((v) => v.status !== "gepland") || D.vergaderingen[0]; VID = recent.id; }
  if (VID) await laadVergadering(VID);
  if (h === "#acties") kiesTab("acties"); else if (h === "#beslissingen") kiesTab("beslissingen");
}
function kiesTab(t) {
  TAB = t; document.querySelectorAll("[data-tab]").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
  ["vergaderingen", "acties", "beslissingen"].forEach((k) => { $("v-" + k).hidden = k !== t; }); melding("");
}

/* ---------------------------------------------------------------- vergaderingen */
function tekenLijst() {
  const L = D.vergaderingen || [];
  $("vLijst").innerHTML = L.length ? L.map((v) => { const st = STATUS_V[v.status] || [v.status, ""];
    return `<button type="button" class="verg" data-verg="${v.id}" aria-pressed="${v.id === VID}"><span class="r"><b>${esc(datumLang(v.datum))}</b><span class="pill ${st[1]}">${esc(v.status === "ontwerp" ? "ontwerp" : st[0].toLowerCase())}</span></span>
      <small>${esc(v.code)} · ${v.punten} punten · ${v.open} van ${v.acties} acties open</small>
      ${v.status === "ter_bevestiging" ? `<small>${v.bevestigd} van ${(D.leden || []).length} bevestigd${v.ik_bevestigd ? " · jij ✓" : ""}</small>` : ""}</button>`; }).join("")
    : `<div class="leeg">Nog geen vergaderingen.</div>`;
}
async function laadVergadering(id) {
  VID = id; tekenLijst();
  V = await rpc("club_comm_vergadering", { p_id: id });
  if (V.fout) { melding(V.fout, "fout"); return; }
  tekenVergadering();
}
function tekenVergadering() {
  const st = STATUS_V[V.status] || [V.status, ""], P = V.punten || [];
  const nBesl = P.filter((p) => ["beslissing", "rvb"].includes(p.soort)).length;
  const alleActies = P.flatMap((p) => p.acties || []), open = alleActies.filter((a) => ["open", "bij_rvb"].includes(a.status)).length;
  const vragen = P.reduce((n, p) => n + (p.open_vragen || []).length, 0);
  const totMin = P.reduce((n, p) => n + p.minuten, 0) || 1;
  const begin = dt(V.datum); let t = begin.getHours() * 60 + begin.getMinutes();
  const klok = (m) => `${Math.floor(m / 60)}u${String(m % 60).padStart(2, "0")}`;
  const kop = `<section class="panel">
    <div class="lijn" style="justify-content:space-between;align-items:flex-start">
      <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
        <span class="lbl">BTC-PC-${esc(V.code)} · ${esc(datumLang(V.datum))} · ${uur(V.datum)}${V.plaats ? " · " + esc(V.plaats) : ""}</span>
        <h2>${esc(V.titel)}</h2>
        ${V.doel ? `<span style="font-size:.88rem">${esc(V.doel)}</span>` : ""}
        <span class="muted" style="font-size:.82rem">Aanwezig ${V.aanwezig.length}/${V.aanwezig.length + V.afwezig.length}: ${V.aanwezig.map(esc).join(", ")}${V.afwezig.length ? ` · verontschuldigd: ${V.afwezig.map(esc).join(", ")}` : ""}</span>
      </div>
      <span class="pill ${st[1]}">${st[0]}</span>
    </div>
    <div class="kpis"><div class="kpi"><b>${P.length}</b><span>agendapunten · ${totMin} min</span></div><div class="kpi"><b>${nBesl}</b><span>beslispunten</span></div><div class="kpi"><b>${open}/${alleActies.length}</b><span>acties open</span></div><div class="kpi"><b>${vragen}</b><span>open vragen</span></div></div>
    <div class="balk" aria-hidden="true">${P.map((p) => `<span class="k-${p.soort}" style="width:${(p.minuten / totMin) * 100}%" title="${p.nr}. ${esc(p.titel)}"></span>`).join("")}</div>
    ${bevestigBlok()}
  </section>`;
  const punten = P.map((p) => { const van = t; t += p.minuten;
    return `<details class="punt k-${p.soort}">
      <summary><span class="nr">${p.nr}</span><div><span class="titel">${esc(p.titel)}</span><div class="meta"><span class="soort">${SOORT[p.soort] || p.soort}</span>${p.wie ? `<span class="tag">${esc(p.wie)}</span>` : ""}${p.bijlage ? `<span class="tag">bijlage: ${esc(p.bijlage)}</span>` : ""}${(p.acties || []).length ? `<span class="tag">${p.acties.length} ${p.acties.length === 1 ? "actie" : "acties"}</span>` : ""}${(p.open_vragen || []).length ? `<span class="tag">${p.open_vragen.length} open ${p.open_vragen.length === 1 ? "vraag" : "vragen"}</span>` : ""}</div></div>
        <span class="klok">${klok(van)} · ${p.minuten} min</span></summary>
      <div class="body">
        ${(p.voorbereiding || []).length ? `<div class="blok voor"><span class="lbl">Voorbereiding</span>${lijst(p.voorbereiding)}</div>` : ""}
        ${(p.te_beslissen || []).length ? `<div class="blok dec"><span class="lbl">Te beslissen</span>${lijst(p.te_beslissen)}</div>` : ""}
        ${(p.besluit || []).length ? `<div class="blok besl"><span class="lbl">Besluit</span>${lijst(p.besluit)}</div>` : V.status === "gepland" ? "" : `<div class="blok voor"><span class="lbl">Besluit</span><span class="muted">Nog niet in het verslag.</span></div>`}
        ${(p.acties || []).length ? `<div class="acties">${p.acties.map((a) => actieRij(a, false)).join("")}</div>` : ""}
        ${(p.open_vragen || []).length ? `<div class="blok vraag"><span class="lbl">${p.soort === "rvb" ? "Naar de RvB" : "Open vragen"}</span>${lijst(p.open_vragen)}</div>` : ""}
      </div></details>`; }).join("");
  $("vDetail").innerHTML = kop + punten;
}
function bevestigBlok() {
  const nog = V.nog_te_bevestigen || [], B = V.bevestigingen || [], mijn = B.find((b) => b.ik);
  const namen = `<div class="namen">${B.map((b) => `<span class="${b.akkoord ? "ja" : "nee"}" title="${esc(b.opmerking || "")}">${esc(b.naam)} ${b.akkoord ? "✓" : "· opmerking"}</span>`).join("")}${nog.filter((n) => !B.some((b) => b.naam === n)).map((n) => `<span>${esc(n)} · nog niet</span>`).join("")}</div>`;
  const opm = B.filter((b) => !b.akkoord && b.opmerking).map((b) => `<div style="font-size:.85rem"><b>${esc(b.naam)}:</b> ${esc(b.opmerking)}</div>`).join("");
  let blok = "";
  if (V.status === "ter_bevestiging") {
    blok = `<div class="bev"><div class="lbl">Bevestiging door de commissie</div>${namen}${opm}
      ${mijn && mijn.akkoord ? `<span class="muted" style="font-size:.85rem">Jij bevestigde dit verslag.</span>` : `<textarea id="bevOpm" maxlength="500" placeholder="Opmerking (enkel nodig als er iets aangepast moet worden)">${esc(mijn && mijn.opmerking || "")}</textarea>
      <div class="lijn"><button type="button" class="primary" data-bev="1">Ik bevestig het verslag</button><button type="button" data-bev="0">Opmerking doorgeven</button></div>`}
    </div>`;
  } else if (V.status === "goedgekeurd") {
    blok = `<div class="muted" style="font-size:.85rem">Goedgekeurd door ${esc(V.goedgekeurd_door || "de voorzitter")}${V.goedgekeurd_op ? " op " + new Date(V.goedgekeurd_op).toLocaleDateString("nl-BE") : ""}.</div>`;
  } else if (V.status === "ontwerp") {
    blok = `<div class="muted" style="font-size:.85rem">Ontwerpverslag: nog niet voorgelegd aan de commissie.</div>`;
  }
  if (D.voorzitter) {
    const k = [];
    if (V.status === "ontwerp") k.push(`<button type="button" class="primary" data-vstatus="ter_bevestiging">Voorleggen ter bevestiging</button>`);
    if (V.status === "ter_bevestiging") { k.push(`<button type="button" class="primary" data-vstatus="goedgekeurd">Verslag goedkeuren</button>`); k.push(`<button type="button" data-vstatus="ontwerp">Terug naar ontwerp</button>`); }
    if (V.status === "goedgekeurd") k.push(`<button type="button" data-vstatus="ontwerp">Goedkeuring intrekken</button>`);
    if (k.length) blok += `<div class="lijn"><span class="lbl">Voorzitter</span>${k.join("")}</div>`;
  }
  return blok;
}

/* ---------------------------------------------------------------- acties */
function actieRij(a, metBron) {
  const laat = isLaat(a);
  const dl = a.deadline ? dKort(a.deadline) : (a.deadline_tekst || "—");
  const st = a.mag ? `<select data-actie="${a.id}" aria-label="Status">${Object.entries(STATUS_A).map(([k, n]) => `<option value="${k}" ${k === a.status ? "selected" : ""}>${n}</option>`).join("")}</select>` : `<span class="pill">${STATUS_A[a.status]}</span>`;
  return `<div class="actie s-${a.status} ${laat ? "laat" : ""}"><span>${esc(a.omschrijving)}${metBron ? `<span class="bron">${esc(a.code)}${a.punt_nr ? ` · punt ${a.punt_nr}${a.punt ? " · " + esc(a.punt) : ""}` : ""}</span>` : ""}</span>
    <span class="eig" style="font-weight:600">${esc(a.eigenaar_naam)}</span><span class="dl ${laat ? "laat" : ""}">${esc(dl)}${laat ? " · te laat" : ""}</span>${st}</div>`;
}
function tekenActies() {
  let L = D.acties || [];
  if (FILTER === "mijn") L = L.filter((a) => a.eigenaar === D.ik && ["open", "bij_rvb"].includes(a.status));
  else if (FILTER === "open") L = L.filter((a) => ["open", "bij_rvb"].includes(a.status));
  else if (FILTER === "laat") L = L.filter(isLaat);
  $("aLijst").innerHTML = L.length ? L.map((a) => actieRij(a, true)).join("") : `<div class="leeg">${FILTER === "mijn" ? "Je hebt geen open acties." : "Geen acties in deze selectie."}</div>`;
}

/* ---------------------------------------------------------------- beslissingen */
function tekenBesl() {
  const q = $("bZoek").value.trim().toLowerCase();
  const L = (D.beslissingen || []).filter((b) => !q || (b.tekst + " " + b.code).toLowerCase().includes(q));
  $("bLijst").innerHTML = L.length ? L.map((b) => `<div class="bs"><div class="r"><b>${esc(b.code)}</b><span class="muted" style="font-size:.8rem">${new Date(b.datum + "T12:00").toLocaleDateString("nl-BE")}${b.vergadering ? ` · ${esc(b.vergadering)}${b.punt_nr ? " punt " + b.punt_nr : ""}` : ""}</span><span style="flex:1"></span><span class="pill ${b.niveau === "rvb" ? "warn" : "ok"}">${b.niveau === "rvb" ? "RvB" : "Commissie"}</span></div><span>${esc(b.tekst)}</span></div>`).join("")
    : `<div class="leeg">Geen beslissingen gevonden.</div>`;
}

/* ---------------------------------------------------------------- acties op de pagina */
document.addEventListener("click", async (e) => {
  const tab = e.target.closest("[data-tab]"); if (tab) { kiesTab(tab.dataset.tab); return; }
  const vg = e.target.closest("[data-verg]"); if (vg) { history.replaceState(null, "", "#v" + vg.dataset.verg); laadVergadering(+vg.dataset.verg).catch((err) => melding(err.message, "fout")); return; }
  const f = e.target.closest("[data-f]"); if (f) { FILTER = f.dataset.f; document.querySelectorAll("#aFilters button").forEach((b) => b.setAttribute("aria-pressed", String(b === f))); tekenActies(); return; }
  const bev = e.target.closest("[data-bev]");
  if (bev) {
    const ok = bev.dataset.bev === "1", opm = $("bevOpm") ? $("bevOpm").value : "";
    bev.disabled = true;
    try { const j = await rpc("club_comm_bevestig", { p_id: VID, p_akkoord: ok, p_opmerking: opm });
      if (j.fout) { melding(j.fout, "fout"); return; }
      melding(ok ? "Bedankt, je bevestigde het verslag." : "Je opmerking is doorgegeven aan de voorzitter.", "ok"); await laad();
    } catch (err) { melding(err.message, "fout"); } finally { bev.disabled = false; }
    return;
  }
  const vs = e.target.closest("[data-vstatus]");
  if (vs) {
    if (vs.dataset.zeker !== "1") { vs.dataset.zeker = "1"; vs.textContent = "Zeker? Klik opnieuw"; return; }
    const j = await rpc("club_comm_status", { p_id: VID, p_status: vs.dataset.vstatus });
    if (j.fout) { melding("Lukt niet: " + j.fout + ".", "fout"); await laadVergadering(VID); return; }
    melding(vs.dataset.vstatus === "ter_bevestiging" ? "Verslag voorgelegd: de commissieleden krijgen een melding." : vs.dataset.vstatus === "goedgekeurd" ? "Verslag goedgekeurd." : "Verslag terug in ontwerp.", "ok"); await laad();
  }
});
document.addEventListener("change", async (e) => {
  const s = e.target.closest("select[data-actie]"); if (!s) return;
  s.disabled = true;
  try { const j = await rpc("club_comm_actie", { p_id: +s.dataset.actie, p_status: s.value });
    if (j.fout) { melding(j.fout, "fout"); } else { melding("Status aangepast.", "ok"); }
    await laad();
  } catch (err) { melding(err.message, "fout"); } finally { s.disabled = false; }
});
$("bZoek").addEventListener("input", () => D && tekenBesl());
$("afmelden").addEventListener("click", () => BTC.afmelden());
laad().catch((err) => melding("Laden lukte niet: " + (err.message || err), "fout"));
})();
</script>
</body>
